const T=D.tabs,$=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=v=>v==null?'—':(Math.round(v*1000)/10)+'%';
$('#wk').textContent=D.days||D.date;
$('#up').textContent='Updated '+D.updated;

function tbl(h,rows){
  if(!rows||!rows.length) return '<div class="mu">Nothing logged yet.</div>';
  return '<div class="tw"><table><tr>'+h.map(x=>'<th>'+e(x)+'</th>').join('')+'</tr>'+
    rows.map(r=>'<tr>'+r.slice(0,h.length).map(v=>'<td>'+e(v)+'</td>').join('')+'</tr>').join('')+'</table></div>';
}
function confPill(v){
  const s=String(v||'').toLowerCase();
  if(s==='yes'||s==='true') return '<span class="pill">Confirmed</span>';
  if(s==='no'||s==='false') return '<span class="pill no">Unconfirmed</span>';
  return '<span class="pill wait">'+e(v||'—')+'</span>';
}
function pickTable(rows){
  const heads=['Date','Player','Stat','Cutoff','Side','App','Status','Result','Sim Hit %','Sim Median'];
  return '<div class="tw"><table><tr>'+heads.map(x=>'<th>'+e(x)+'</th>').join('')+'</tr>'+
    rows.map(r=>{
      const res=r[7]||'Pending';
      const cls=/^(W|HIT)/i.test(res)?'v':(res==='Pending'?'pending':'');
      return '<tr class="'+cls+'"><td>'+e(r[0])+'</td><td><b>'+e(r[1])+'</b></td><td>'+e(r[2])+'</td><td>'+e(r[3])+
        '</td><td>'+e(r[4])+'</td><td>'+e(r[5])+'</td><td>'+confPill(r[6])+'</td><td>'+e(res)+'</td><td><b>'+e(r[8]||'—')+'</b></td><td>'+e(r[9]||'—')+'</td></tr>';
    }).join('')+'</table></div>';
}

const V={
Games(){
  const cards=T.Games.cards||[];
  const note=T.Games.sim_note||'';
  const live=cards.filter(g=>g.state==='in').length;
  const done=cards.filter(g=>g.state==='post').length;
  const pre=cards.filter(g=>g.state==='pre').length;
  let html='<div class="info">'+cards.length+' games · <b>'+live+'</b> live · <b>'+done+'</b> final · <b>'+pre+'</b> upcoming</div>';
  if(note) html+='<div class="mu" style="margin-bottom:10px">'+e(note)+'</div>';
  html+=cards.map(g=>{
    const st=g.state==='in'?'LIVE':(g.state==='post'?'FINAL':'UPCOMING');
    const stColor=g.state==='in'?'var(--ac)':(g.state==='post'?'var(--mu)':'var(--hm)');
    const aw=g.away_win_pct, hw=g.home_win_pct;
    let bar='';
    if(aw!=null && hw!=null){
      const awp=Math.max(aw*100,0), hwp=Math.max(hw*100,0);
      bar='<div class="bar"><div class="a" style="width:'+awp+'%">'+e(g.away)+' '+P(aw)+'</div>'+
          '<div class="h" style="width:'+hwp+'%">'+P(hw)+' '+e(g.home)+'</div></div>';
    }
    const proj=g.proj_score||((g.away_proj!=null)?(g.away+' '+Math.round(g.away_proj)+'–'+Math.round(g.home_proj)+' '+g.home):'—');
    const lean=(g.sp_lean?('<div style="grid-column:1/3"><span>Model lean</span><b>'+e(g.sp_pick||'')+'</b> · '+e(g.sp_lean)+
      '<div class="mu">Home margin '+e(g.spread_home)+' · total '+e(g.total_proj)+' · '+(g.sims||10000)+' sims</div></div>'):'');
    const inj=g.inj_note?('<div class="mu" style="margin-top:6px">Inj adj: '+e(g.inj_note)+'</div>'):'';
    return '<div class="card"><div class="row"><div class="mt">'+e(g.matchup)+'</div><div class="mu" style="color:'+stColor+';font-weight:700">'+st+
      '</div></div><div class="mu">'+e(g.away_name)+' at '+e(g.home_name)+'</div>'+bar+
      '<div class="kv"><div><span>Tip (CT)</span>'+e(g.tip)+
      '</div><div><span>Status</span>'+e(g.clock)+'</div><div><span>Score</span>'+e(g.score||'—')+
      '</div><div><span>Projected</span>'+e(proj)+'</div>'+lean+
      '<div><span>Venue</span>'+e(g.venue)+'</div></div>'+inj+'</div>';
  }).join('');
  return html;
},
"Pick'em"(){
  const E=T["Pick'em"].entries||{};
  let html='<div class="note">'+e(E.note||'Check Underdog and PrizePicks before locking anything.')+'</div>';
  html+='<div class="card"><h3>Suggested slip shapes</h3><div class="kv"><div><span>2-pick</span>'+e(E['2-pick']||'—')+
    '</div><div><span>3-pick</span>'+e(E['3-pick']||'—')+'</div></div>'+
    (E.sim?'<div class="kv" style="margin-top:8px">'+Object.entries(E.sim).map(([k,v])=>'<div><span>'+e(k)+' sim hit %</span><b>'+(v.hit_pct==null?'no sim':P(v.hit_pct))+'</b></div>').join('')+'</div>':'')+'<div class="mu" style="margin-top:8px">Apps: Underdog · PrizePicks. Side = More / Less vs the app line.</div></div>';
  if(D.props_sim) html+='<div class="mu" style="margin-bottom:8px">Sim Hit % = share of '+D.props_sim.sims.toLocaleString()+' player-prop sims where the leg wins (Less uses P(under)). Joint % shares same-game pace/blowout shocks. Small samples early season — not a lock.</div>';
  const rows=T["Pick'em"].r||[];
  if(!rows.length){
    return html+'<div class="card"><h3>Tonight\'s picks</h3><div class="mu">No pick\'em slip logged yet for this slate.</div></div>';
  }
  html+='<div class="card"><h3>Logged cutoffs</h3><div class="mu" style="margin-bottom:8px">Play only if the live app line is at or below the cutoff. Unconfirmed = not verified in-app when logged.</div>'+
    pickTable(rows)+'</div>';
  return html;
},
'Player Props'(){
  const ph=T['Player Props'].placeholder||'';
  const rows=T['Player Props'].r||[];
  let html='<div class="note">'+e(ph)+'</div>';
  html+='<div class="card"><h3>How props land here</h3><div class="mu">1. Confirm the Underdog or PrizePicks line in-app.<br>2. Log player / stat / line / More or Less.<br>3. Site shows the board — never a made-up number.</div></div>';
  if(rows.length) html+='<div class="card">'+tbl(T['Player Props'].h,rows)+'</div>';
  else html+='<div class="card"><div class="mu">Board empty — waiting on confirmed app lines.</div><div class="f">'+
    ['Points','Rebounds','Assists','Pts+Reb+Ast','3PM','Steals','Blocks','Combo props'].map(t=>'<span class="tag">'+t+'</span>').join('')+
    '</div></div>';
  return html;
},
Injuries(){
  const R=T.Injuries, rows=R.r||[];
  let html='<div class="info">'+e(R.source||'Injury report')+' · '+rows.length+' listed</div>';
  const teams=[...new Set(rows.map(r=>r[0]))].sort();
  html+='<div class="card"><input id="iq" placeholder="Search player or team…"><select id="it"><option value="">All teams</option>'+
    teams.map(t=>'<option>'+e(t)+'</option>').join('')+'</select><div id="itbl"></div></div>';
  setTimeout(()=>{
    const go=()=>{
      const q=$('#iq').value.toLowerCase(), t=$('#it').value;
      const f=rows.filter(r=>(!t||r[0]===t)&&(!q||(r[0]+' '+r[1]+' '+r[2]+' '+r[3]).toLowerCase().includes(q)));
      $('#itbl').innerHTML=tbl(['Team','Player','Status','Note'],f);
    };
    $('#iq').oninput=go; $('#it').onchange=go; go();
  });
  return html;
},
'Track Record'(){
  const R=T['Track Record'], s=R.summary||{};
  let html='<div class="card"><h3>'+(s.season||2026)+' Pick\'em record</h3><div class="kv">'+
    '<div><span>Graded</span>'+(s.w||0)+'-'+(s.l||0)+(s.p?('-'+s.p):'')+'</div>'+
    '<div><span>Hit rate</span>'+P(s.hit)+'</div>'+
    '<div><span>Picks graded</span>'+(s.n||0)+'</div>'+
    '<div><span>Pending</span>'+(s.pending||0)+'</div></div>'+
    '<div class="mu" style="margin-top:8px">'+e(R.note||'')+'</div></div>';
  const rows=R.r||[];
  html+='<div class="card"><h3>All logged picks</h3>'+(rows.length?pickTable(rows):
    '<div class="mu">No slips yet. Results post after games are final and confirmed lines are graded.</div>')+'</div>';
  html+='<div class="card"><h3>Apps tracked</h3><div class="mu"><b>Underdog</b> · <b>PrizePicks</b> — More/Less vs app line. Break-even depends on slip size.</div></div>';
  return html;
}
};

const names=Object.keys(V);
function show(n){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.textContent===n));
  $('#m').innerHTML=V[n]();
  scrollTo(0,0);
}
$('#nav').innerHTML=names.map(n=>'<button type="button">'+n+'</button>').join('');
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.textContent));
show('Games');
